<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.svg" title="image/svg+xml">
    <link rel="stylesheet" href="./css/style.css">
    <title>LogicSim - Sobre</title>
</head>
<body>
    <header class="simulator-page theme-ligth">
        <a href="./simulador.html">
            <svg width="200" height="60" viewBox="0 0 200 60"           xmlns="http://www.w3.org/2000/svg">
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold">
                <tspan fill="#007BFF">Logic</tspan><tspan fill="#000000">Sim</tspan>
                 </text>
            </svg>
        </a>

        <div class="top-navbar__right">
                <button
                    id="theme-toggle"
                    type="button"
                    class="toolbar-btn theme-toggle-btn"
                    aria-label="Alternar tema"
                    title="Alternar tema"
                >
                    <i class="fa-solid fa-sun" aria-hidden="true" data-theme-icon="sun"></i>
                    <i class="fa-solid fa-moon" aria-hidden="true" data-theme-icon="moon"></i>
                </button>
            </div>
    </header>

    <section class="sobre-bg">
        <div class="sobre-contexto">
            <img src="./img/circuito.svg" alt="circuito">
            <img src="./img/LogicSim-Marca.svg" alt="Logo">
            <p>MANUTENÇÃO - KEVIN JAJA SERA FEITA</p>
            <p>Versão 1.0</p>
            <p>Aplicação desenvolvida para facilitar o aprendizado de lógica digital através da simulação de portas lógicas, visualização de expressões booleanas e geração automáticas de tabelas verdade.</p>
        </div>
    </section>

    <script src="./js/config/menu.js"></script>
    <script src="./js/editor/theme-toggle.js"></script>
    
</body>
</html>
