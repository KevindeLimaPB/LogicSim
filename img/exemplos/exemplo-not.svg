<svg xmlns="http://www.w3.org/2000/svg" width="910" height="420" viewBox="0 0 910 420">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feColorMatrix in="blur" mode="matrix" values="0 0 0 0 0.23 0 0 0 0 0.77 0 0 0 0 0.82 0 0 0 1 0" result="cyanGlow"/>
      <feMerge>
        <feMergeNode in="cyanGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0a0a0d"/>
  
  <!-- Linhas de conexão -->
  <g filter="url(#glow)">
    <path d="M 230 148 Q 280 148, 380 205" stroke="#3bc4d1" stroke-width="3" fill="none"/>
    <path d="M 230 260 Q 280 260, 380 205" stroke="#3bc4d1" stroke-width="3" fill="none"/>
    <path d="M 460 205 Q 520 205, 655 205" stroke="#3bc4d1" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Bloco de Entrada A (Alterado para 0) -->
  <g transform="translate(70, 95)">
    <rect width="180" height="90" rx="15" ry="15" fill="#1b242e" stroke="#2c3a47" stroke-width="1.5"/>
    <text x="35" y="50" font-family="Arial, sans-serif" font-size="20" fill="#a0b0c0" font-weight="bold">A</text>
    <path d="M 60 45 L 67 52 L 74 45" stroke="#a0b0c0" stroke-width="2.5" fill="none"/>
    <circle cx="115" cy="48" r="18" fill="#e8e8e1"/>
    <text x="115" y="55" font-family="Arial, sans-serif" font-size="20" fill="#d9534f" font-weight="bold" text-anchor="middle">0</text>
    <circle cx="155" cy="48" r="8" fill="#1b242e" stroke="#d9534f" stroke-width="2"/>
    <circle cx="155" cy="48" r="5" fill="#d9534f"/>
  </g>
  
  <!-- Bloco de Entrada B (Alterado para 0) -->
  <g transform="translate(70, 215)">
    <rect width="180" height="90" rx="15" ry="15" fill="#1b242e" stroke="#2c3a47" stroke-width="1.5"/>
    <text x="35" y="50" font-family="Arial, sans-serif" font-size="20" fill="#a0b0c0" font-weight="bold">B</text>
    <path d="M 60 45 L 67 52 L 74 45" stroke="#a0b0c0" stroke-width="2.5" fill="none"/>
    <circle cx="115" cy="48" r="18" fill="#e8e8e1"/>
    <text x="115" y="55" font-family="Arial, sans-serif" font-size="20" fill="#d9534f" font-weight="bold" text-anchor="middle">0</text>
    <circle cx="155" cy="48" r="8" fill="#1b242e" stroke="#d9534f" stroke-width="2"/>
    <circle cx="155" cy="48" r="5" fill="#d9534f"/>
  </g>
  
  <!-- Porta Lógica NOT -->
  <g transform="translate(380, 155)">
    <circle cx="0" cy="50" r="8" fill="#e8e8e1" filter="url(#glow)"/>
    <line x1="8" y1="50" x2="30" y2="50" stroke="#f0f0e8" stroke-width="2.5"/>
    <path d="M 30 25 L 65 50 L 30 75 Z" stroke="#f0f0e8" stroke-width="3" fill="none"/>
    <circle cx="72" cy="50" r="7" stroke="#f0f0e8" stroke-width="2.5" fill="#0a0a0d"/>
    <line x1="79" y1="50" x2="100" y2="50" stroke="#f0f0e8" stroke-width="2.5"/>
    <circle cx="100" cy="50" r="8" fill="#e8e8e1" filter="url(#glow)"/>
  </g>
  
  <!-- Bloco de Saída OUT (Invertido para 1) -->
  <g transform="translate(630, 160)">
    <rect width="140" height="90" rx="15" ry="15" fill="#1b242e" stroke="#2c3a47" stroke-width="1.5"/>
    <circle cx="25" cy="45" r="8" fill="#ffb74d"/>
    <text x="120" y="38" font-family="Arial, sans-serif" font-size="16" fill="#a0b0c0" font-weight="bold" text-anchor="end">OUT</text>
    <text x="100" y="70" font-family="Arial, sans-serif" font-size="22" fill="#5cb85c" font-weight="bold" text-anchor="end">1</text>
  </g>
</svg>
