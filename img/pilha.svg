<svg width="120" height="160" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <g
    stroke="#E5E5E5"
    stroke-width="4"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

   

    <!-- terminal superior -->
    <rect x="46" y="20" width="28" height="10" rx="2"/>

    <!-- corpo -->
    <rect x="30" y="30" width="60" height="90" rx="8"/>

    <!-- + -->
    <line x1="60" y1="50" x2="60" y2="62"/>
    <line x1="54" y1="56" x2="66" y2="56"/>

    <!-- - -->
    <line x1="54" y1="86" x2="66" y2="86"/>

    <!-- terminal inferior -->
    <rect x="46" y="120" width="28" height="10" rx="2"/>

    

  </g>
</svg>