<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 300"
     width="100%"
     style="background:#0b0e14;font-family:sans-serif">

  <defs>
    <style>
      .wire { stroke:#38bdf8; stroke-width:5; fill:none; stroke-linecap:round; }
      .txt { fill:#e2e8f0; font-size:18px; font-weight:bold; }
      .box { fill:#111823; stroke:#1e293b; stroke-width:2; rx:10; }
      .node { fill:#fb923c; }
      .lamp { fill:#facc15; stroke:#f59e0b; stroke-width:3; }
    </style>
  </defs>

  <!-- BATERIA -->
  <g transform="translate(60,80)">
    <rect width="80" height="140" class="box"/>
    <text x="40" y="30" text-anchor="middle" class="txt">+</text>
    <text x="40" y="120" text-anchor="middle" class="txt">-</text>
  </g>

  <!-- FIO SAINDO DA BATERIA -->
  <path d="M 140 120 L 200 120" class="wire"/>

  <!-- CHAVE A -->
  <g transform="translate(200,85)">
    <text x="40" y="0" text-anchor="middle" class="txt">A</text>

    <circle cx="20" cy="40" r="7" class="node"/>
    <circle cx="80" cy="40" r="7" class="node"/>

    <!-- aberto -->
    <line x1="20" y1="40" x2="75" y2="20" stroke="#ffffff" stroke-width="4"/>
  </g>

  <path d="M 280 125 L 345 125" class="wire"/>

  <!-- CHAVE B -->
  <g transform="translate(340,85)">
    <text x="40" y="0" text-anchor="middle" class="txt">B</text>

    <circle cx="20" cy="40" r="7" class="node"/>
    <circle cx="80" cy="40" r="7" class="node"/>

    <!-- aberto -->
    <line x1="20" y1="40" x2="75" y2="20" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- SUBIDA ANTES DA LÂMPADA -->
  <path d="M 420 120 L 420 70 L 640 70" class="wire"/>

  <!-- LÂMPADA -->
  <g transform="translate(640,35)">
    <circle cx="60" cy="60" r="35" class="lamp"/>
    <text x="60" y="67" text-anchor="middle" fill="#0b0e14" font-weight="bold">Y</text>
  </g>

  <!-- DESCIDA LIMPA (SEM CRUZAR LÂMPADA) -->
  <path d="M 700 150 L 700 240" class="wire"/>

  <!-- RETORNO INFERIOR -->
  <path d="M 700 240 L 120 240 L 120 220" class="wire"/>

</svg>