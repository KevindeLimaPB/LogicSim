<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" style="background-color: #0b0e14; font-family: sans-serif;">
  <defs>
    <style>
      .table-bg { fill: #111823; stroke: #1e293b; stroke-width: 2; rx: 12px; }
      .header-bg { fill: #1e293b; }
      .row-line { stroke: #1e293b; stroke-width: 1; }
      .col-line { stroke: #1e293b; stroke-width: 1; }
      .text-header { fill: #94a3b8; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-data { fill: #ffffff; font-size: 15px; text-anchor: middle; }
      .val-off { fill: #ef4444; font-weight: bold; }
      .val-on { fill: #4ade80; font-weight: bold; }
    </style>
  </defs>

  <g transform="translate(30, 50)">
    <rect width="300" height="156" class="table-bg" />

    <path d="M 0,12 A 12,12 0 0,1 12,0 L 288,0 A 12,12 0 0,1 300,12 L 300,50 L 0,50 Z" class="header-bg" />

    <line x1="0" y1="50" x2="300" y2="50" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="103" x2="300" y2="103" class="row-line" />

    <line x1="150" y1="0" x2="150" y2="156" class="col-line" />

    <text x="75" y="30" class="text-header">ENTRADA A</text>
    <text x="225" y="30" class="text-header" fill="#38bdf8">SAÍDA (NOT A)</text>

    <g transform="translate(0, 50)">
      <text x="75" y="32" class="text-data">0 <tspan class="val-off">(OFF)</tspan></text>
      <text x="225" y="32" class="text-data" font-weight="bold">1 <tspan class="val-on">(ON)</tspan></text>
    </g>

    <g transform="translate(0, 103)">
      <text x="75" y="32" class="text-data">1 <tspan class="val-on">(ON)</tspan></text>
      <text x="225" y="32" class="text-data" font-weight="bold">0 <tspan class="val-off">(OFF)</tspan></text>
    </g>
  </g>
</svg>