  <text x="27.5" y="148" class="text">1</text>
  <text x="62.5" y="148" class="text">0</text>
  <text x="115" y="148" class="text">0</text>

  <text x="27.5" y="181" class="text">1</text>
  <text x="62.5" y="181" class="text">1</text>
  <text x="115" y="181" class="text">1</text>
</svg>
