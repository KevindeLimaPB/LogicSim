<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <style>
    .grid { stroke: #333333; stroke-width: 2; fill: none; }
    .text { font-family: sans-serif; font-size: 16px; fill: #333333; text-anchor: middle; }
    .header { font-weight: bold; }
  </style>

  <rect width="160" height="200" fill="#ffffff"/>

  <line x1="10" y1="10" x2="150" y2="10" class="grid" />
  <line x1="10" y1="48" x2="150" y2="48" class="grid" />
  <line x1="10" y1="86" x2="150" y2="86" class="grid" />
  <line x1="10" y1="124" x2="150" y2="124" class="grid" />
  <line x1="10" y1="162" x2="150" y2="162" class="grid" />
  <line x1="10" y1="190" x2="150" y2="190" class="grid" />

  <line x1="10" y1="10" x2="10" y2="190" class="grid" />
  <line x1="45" y1="10" x2="45" y2="190" class="grid" />
  <line x1="80" y1="10" x2="80" y2="190" class="grid" />
  <line x1="150" y1="10" x2="150" y2="190" class="grid" />

